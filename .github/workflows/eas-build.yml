name: Build OPMOUS Booster APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Extract project zip (if needed)
        shell: bash
        run: |
          set -e
          if [ -f "package.json" ]; then
            echo "package.json sudah ada di root. Lewati extract."
            exit 0
          fi

          ZIP_FILE=$(find . -maxdepth 1 -type f -iname '*.zip' -print -quit)
          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Tidak ada package.json maupun file .zip di root repo."
            ls -la
            exit 1
          fi

          echo "Ditemukan zip: $ZIP_FILE. Meng-extract ke root repo..."
          unzip -o "$ZIP_FILE" -d .

          if [ ! -f "package.json" ]; then
            echo "ERROR: Setelah extract, package.json tetap tidak ditemukan di root."
            echo "Kemungkinan isi zip ada di dalam satu folder pembungkus. Isi zip:"
            unzip -l "$ZIP_FILE"
            exit 1
          fi
          echo "Extract berhasil. package.json ditemukan di root."

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Check EXPO_TOKEN
        shell: bash
        run: |
          if [ -z "${{ secrets.EXPO_TOKEN }}" ]; then
            echo "ERROR: Secret EXPO_TOKEN belum di-set."
            echo "Tambahkan di: Settings -> Secrets and variables -> Actions -> New repository secret"
            exit 1
          fi
          echo "EXPO_TOKEN tersedia. OK."

      - name: Install dependencies
        shell: bash
        run: npm install --no-audit --no-fund

      - name: Build APK
        shell: bash
        run: eas build --platform android --profile preview --non-interactive
